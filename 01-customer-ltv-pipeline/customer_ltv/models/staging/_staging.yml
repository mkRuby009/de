version: 2

models:
    - name: stg_customers
      description: one row per customer
      columns:
        - name: customer_id
          data_tests:
            - not_null
            - unique
    
    - name: stg_orders
      description: orders, renamed. One row per order
      columns:
        - name: order_id
          data_tests:
            - not_null
            - unique
        - name: customer_id
          data_tests:
            - not_null
            - relationships:
                to: ref('stg_customers')
                field: customer_id
        - name: status
          data_tests:
            - accepted_values:
                values: ['placed', 'shipped', 'completed', 'return_pending', 'returned']
    
    - name: stg_payments
      description: Payments with amounts converted to dollars
      columns:
        - name: payment_id
          data_tests:
            - not_null
            - unique
        - name: order_id
          data_tests:
            - not_null
            - relationships:
                to: ref('stg_orders')
                field: order_id
            
        - name: payment_method
          data_tests:
            - accepted_values:
                values: ['credit_card', 'coupon', 'bank_transfer', 'gift_card']
