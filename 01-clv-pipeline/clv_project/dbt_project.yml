
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'clv_project'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'clv_project'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


# Configuring models
# Full documentation: https://docs.getdbt.com/docs/configuring-models

# In this config, we tell dbt to build all models in the clv_project/
# directory as views. These settings can be overridden in the individual model
# files using the `{{ config(...) }}` macro.
seeds:
  clv_project:
    raw_orders:
      +column_types:
        order_date: date
    raw_payments:
      +column_types:
        amount: integer   # cents; converted to dollars in stg_payments

models:
  clv_project:
    staging:
      +materialized: view
    intermediate:
      +materialized: table
    marts:
      +materialized: table

vars:
  # NOTE: We are using assumed customer lifespan used in our predicted_clv_project calculation
  # This is because used jaffle_shop data covers only ~3 months, too short to measure churn customer lifespan.
  # To override this var per run, you can use command : dbt build --vars '{clv_project_lifespan_months: 12}'
  clv_project_lifespan_months: 24