#basic initial settings for my tests on new cluster
#logical level ensures that  table/row metadata is added to decode all changes
# default is replica which logs all standard row and block changes.
wal_level = logical
shared_preload_libraries = 'pg_cron'
cron.database_name = 'shop'
cron.use_background_workers = on
max_slot_wal_keep_size = 128MB
output_plugin_libraries = 'pgoutput, test_decoding, wal2json'

